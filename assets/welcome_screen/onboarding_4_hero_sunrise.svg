<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyHero" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8C2"/>
      <stop offset="45%" stop-color="#FFD1A8"/>
      <stop offset="100%" stop-color="#E8F5F1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE8A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE17A"/>
      <stop offset="100%" stop-color="#FFB454"/>
    </linearGradient>
    <linearGradient id="farPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9BB8C9"/>
      <stop offset="100%" stop-color="#6E93A8"/>
    </linearGradient>
    <linearGradient id="midPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D8A72"/>
      <stop offset="100%" stop-color="#1B5E4F"/>
    </linearGradient>
    <linearGradient id="nearPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16493D"/>
      <stop offset="100%" stop-color="#0A2A23"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD9A0"/>
      <stop offset="100%" stop-color="#BFE3D6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#skyHero)"/>

  <!-- Sun glow + core -->
  <circle cx="200" cy="175" r="110" fill="url(#sunGlow)"/>
  <circle cx="200" cy="175" r="46" fill="url(#sunCore)"/>

  <!-- Birds -->
  <path d="M70 90 Q76 84 82 90 Q88 84 94 90" stroke="#5A4A3A" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M280 70 Q285 65 290 70 Q295 65 300 70" stroke="#5A4A3A" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Far mountain layer -->
  <path d="M0 260 L70 170 L130 230 L190 150 L260 240 L330 180 L400 250 L400 400 L0 400 Z" fill="url(#farPeak)" opacity="0.55"/>

  <!-- Mid mountain layer -->
  <path d="M0 300 L100 195 L175 270 L250 185 L400 290 L400 400 L0 400 Z" fill="url(#midPeak)" opacity="0.92"/>
  <path d="M100 195 L122 222 L78 222 Z" fill="#EAF6F1" opacity="0.85"/>
  <path d="M250 185 L270 210 L230 210 Z" fill="#EAF6F1" opacity="0.85"/>

  <!-- Near mountain (silhouette, foreground) -->
  <path d="M0 340 L140 210 L230 320 L290 250 L400 340 L400 400 L0 400 Z" fill="url(#nearPeak)"/>
  <path d="M140 210 L162 238 L118 238 Z" fill="#0F3D33" opacity="0.6"/>

  <!-- Reflective water strip at base -->
  <rect x="0" y="370" width="400" height="30" fill="url(#waterGrad)" opacity="0.5"/>

  <!-- Tiny climbing figure on the near peak ridge -->
  <g transform="translate(195 250)">
    <ellipse cx="0" cy="20" rx="10" ry="3" fill="#0A2A23" opacity="0.3"/>
    <path d="M-4 6 L-7 18 M4 6 L7 17" stroke="#0A2A23" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 -5 L0 8" stroke="#0A2A23" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0 0 L-8 -7 M0 0 L8 -5" stroke="#0A2A23" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-10" r="5" fill="#0A2A23"/>
  </g>

  <!-- Small flag accent at peak -->
  <g transform="translate(140 210)">
    <rect x="-1.5" y="-30" width="3" height="24" fill="#0A2A23"/>
    <path d="M1.5 -30 L22 -23 L1.5 -16 Z" fill="#7C5CFC"/>
  </g>

  <!-- Soft floating sparkles -->
  <circle cx="60" cy="160" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="340" cy="130" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="320" cy="320" r="3" fill="#2ECC71" opacity="0.5"/>
  <circle cx="40" cy="300" r="2.5" fill="#7C5CFC" opacity="0.5"/>
</svg>
