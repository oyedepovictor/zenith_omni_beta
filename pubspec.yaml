name: zenith_omni
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  lottie: ^3.4.0
  percent_indicator: ^4.2.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  html_unescape: ^2.0.0
  just_audio: ^0.10.6
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/welcome_screen/
    - assets/lottie/
    - assets/app_icons/
    - assets/quiz_category_icons/
    - assets/genre_icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/splash_logo_.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B5E4F"
  adaptive_icon_foreground: "assets/splash_logo_.png"

flutter_native_splash:
  color: "#1B5E4F"
  image:  "assets/splash_logo_.png"
  fullscreen: false
  android_12:
    image: "assets/splash_logo_.png"
    color: "#1B5E4F"
